[workspace]
resolver = "3"
members = ["*"]
exclude = ["target"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
talin = { path = "../crates/talin" }
talin-build = { path = "../crates/talin-build" }
talin-provider = { path = "../crates/talin-provider" }

async-trait = "0.1"
dotenvy = "0.15.7"
env_logger = "0.11.8"
log = "0.4.29"
schemars = "1"
serde = "1"
tokio = "1.49.0"
