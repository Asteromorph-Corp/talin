[package]
name = "talin-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A strongly-typed Rust client and type definitions for LLM provider APIs"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true
# The OpenAPI descriptions only back this crate's own tests.
exclude = ["spec"]

[lints]
workspace = true

[dependencies]
async-openai = { version = "0.42.1", default-features = false, features = ["chat-completion-types", "response-types"] }
async-trait.workspace = true
futures = { workspace = true, optional = true }
tokio = { version = "1.52.3", default-features = false, features = ["sync"], optional = true }
# tokio = { workspace = true, default-features = false, features = ["sync"], optional = true }

bytes = { version = "1.11", optional = true }
schemars = { version = "1.0.2", default-features = false, features = ["std"] }
secrecy = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_with = { workspace = true, features = ["base64"] }
# schemars = { workspace = true, default-features = false, features = ["std"] }
time = { version = "0.3.47", features = ["serde"] }

backon = { version = "1", optional = true }
eventsource-stream = { version = "0.2.3", optional = true }
google-cloud-auth = { version = "1.15.0", optional = true }
reqwest = { workspace = true, features = ["json", "query", "stream"], optional = true }

thiserror.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
# Derives the OpenAPI descriptions that `spec/` checks the types against.
utoipa = "5.5.0"

## API Non-WASM dependencies
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1.52.3", features = ["fs", "macros"], optional = true }
tokio-stream = { version = "0.1.1", optional = true }

[features]
default = ["client"]

client = ["async-openai/byot", "async-openai/chat-completion", "async-openai/responses", "async-openai/rustls", "dep:backon", "dep:bytes", "dep:eventsource-stream", "dep:futures", "dep:reqwest", "dep:secrecy", "dep:tokio", "dep:tokio-stream", "dep:tracing"]

# Google Cloud Vertex AI Model Garden backend (`VertexConfig` + the `ClientConfig::Vertex` variant).
vertex = [
  "client",
  "dep:google-cloud-auth",
  "dep:tokio",
]

mcp-client-2025-11-20 = []
compact-2026-09-04 = ["inline-tools-2026-09-15"]
compact-2026-01-12 = ["inline-tools-2026-09-15"]
mid-conversation-tool-changes-2026-07-01 = []
inline-tools-2026-09-15 = []
