name: Release-plz

on:
  push:
    branches:
      - main
      - v0.*

env:
  CARGO_TERM_COLOR: always

jobs:
  # Release unpublished packages
  release-plz-release:
    name: Release-plz release
    runs-on: self-hosted
    if: github.repository == 'Asteromorph-Corp/talin'
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Cargo auth
        env:
          KELLNR_REGISTRY_URL: ${{ secrets.KELLNR_REGISTRY_URL }}
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<CARGO_EOF
          [registries.kellnr]
          index = "sparse+https://${KELLNR_REGISTRY_URL}/api/v1/crates/"
          credential-provider = ["cargo:token"]
          CARGO_EOF

      - name: Setup gh cli
        uses: dev-hanz-ops/install-gh-cli-action@v0.3.0

      - name: Release to crates.io
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Release to kellnr
        uses: release-plz/action@v0.5
        with:
          command: release
          registry: kellnr
          config: .github/release-plz-no-tags.toml # don't create tags / releases again
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.KELLNR_PUBLISH_TOKEN }}

  # Create a PR with the new versions and changelog, preparing the next release.
  release-plz-pr:
    name: Release PR
    runs-on: self-hosted
    if: github.event_name == 'push' && github.repository == 'Asteromorph-Corp/talin'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Mint a token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RUST_CICD_APP_ID }}
          private-key: ${{ secrets.RUST_CICD_APP_PRIVATE_KEY }}

      # needs to use v4 because `release-plz` does not work with v6+ (https://github.com/release-plz/release-plz/issues/2957)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Cargo auth
        env:
          KELLNR_REGISTRY_URL: ${{ secrets.KELLNR_REGISTRY_URL }}
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<CARGO_EOF
          [registries.kellnr]
          index = "sparse+https://${KELLNR_REGISTRY_URL}/api/v1/crates/"
          credential-provider = ["cargo:token"]
          CARGO_EOF

      - name: Setup gh cli
        uses: dev-hanz-ops/install-gh-cli-action@v0.3.0

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          registry: kellnr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.KELLNR_PUBLISH_TOKEN }}
